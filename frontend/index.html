<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redline · sales CRM with an assistant that asks before it writes</title>
    <meta name="description" content="Paste a sales call into Redline. The assistant proposes the CRM updates, and nothing is written until you approve it." />
    <meta name="theme-color" content="#163a2b" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23163a2b'/><rect x='9' y='9' width='14' height='14' rx='2' fill='none' stroke='%239fd8b8' stroke-width='3'/></svg>" />
    <script>
      // Resolve the theme before first paint so the page never flashes the wrong one.
      (function () {
        var t = localStorage.getItem("redline.theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
