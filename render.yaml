# Render Blueprint: a web service built from the Dockerfile and a PostgreSQL database.
# Deploy: https://render.com/deploy?repo=https://github.com/mckova/Redline-crm
services:
  - type: web
    name: redline
    runtime: docker
    plan: free
    healthCheckPath: /api/ai/status
    envVars:
      - key: REDLINE_DATABASE_URL
        fromDatabase: { name: redline-db, property: connectionString }
      - key: REDLINE_SECRET
        generateValue: true
      - key: REDLINE_AI
        value: auto            # offline demo assistant until ANTHROPIC_API_KEY is added
      - key: ANTHROPIC_API_KEY
        sync: false            # optional: add it in the Render dashboard to use Claude
databases:
  - name: redline-db
    plan: free
    databaseName: redline
    user: redline
