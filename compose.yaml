services:
  redline:
    build: .
    ports: ["8000:8000"]
    environment:
      REDLINE_SECRET: change-me-in-production-please
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REDLINE_AI: ${REDLINE_AI:-auto}   # auto: Claude when a key is set, offline demo otherwise
    volumes: ["redline-data:/data"]
volumes:
  redline-data:
